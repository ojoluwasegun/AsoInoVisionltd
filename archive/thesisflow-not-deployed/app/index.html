<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ThesisFlow Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800;900&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--b:#283890;--y:#FFCC00;--bg:#fff;--soft:#EEF1FA;--ink:#1B2150;--line:#D0D6EE;--h:#283890;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12183F;--soft:#1A2255;--ink:#EEF1FF;--line:#33407F;--h:#FFCC00;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12183F;--soft:#1A2255;--ink:#EEF1FF;--line:#33407F;--h:#FFCC00;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Serif 4",Georgia,serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
h1,h2,h3,button,label,th,.bd,nav a{font-family:Archivo,Arial,sans-serif}h1{font-size:1.8rem;margin:0 0 8px;color:var(--h)}h2{font-size:1.1rem;margin:0 0 10px;color:var(--h)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);color:var(--ink);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px 20px;flex-wrap:wrap}
header b{font:900 1.2rem Archivo,sans-serif;color:var(--h)}header b i{background:var(--y);color:var(--b);font:800 .6rem Archivo;letter-spacing:.3em;padding:2px 6px;margin-left:8px;font-style:normal}
.br{color:var(--h);text-decoration:none;display:flex;align-items:center;gap:10px}.br svg{width:38px;height:38px}.hn{display:flex;gap:2px;flex-wrap:wrap;margin-left:14px}.hn a{color:var(--ink);text-decoration:none;font:600 .92rem Archivo,sans-serif;padding:8px 10px;border-bottom:3px solid transparent}.hn a:hover{border-color:var(--y)}.hr{margin-left:auto;display:flex;gap:14px;align-items:center;font:600 .9rem Archivo}.hr a{color:var(--ink);text-decoration:none}.hr a.bt{color:#1B2150}
.w{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 56px)}aside{background:var(--soft);border-right:1px solid var(--line);padding:16px 0}
nav a{display:block;padding:11px 20px;color:var(--ink);text-decoration:none;font-weight:600;font-size:.95rem;border-left:4px solid transparent}nav a[aria-current]{border-color:var(--y);background:var(--bg);color:var(--h)}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--y);display:inline-grid;place-items:center;font:800 1rem Archivo;color:var(--b)}
main{padding:24px 20px 80px;max-width:1000px;width:100%;box-sizing:border-box}.p1{max-width:440px;margin:0 auto}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-bottom:18px}.c{border:1px solid var(--line);background:var(--bg);padding:18px;overflow-x:auto}
button,.bt{background:var(--y);color:#1B2150;border:0;font:800 .85rem Archivo;padding:9px 14px;cursor:pointer;display:inline-block;text-decoration:none;margin:2px 2px 2px 0}button.s,.bt.s{background:var(--b);color:#fff}button.r{background:#B3261E;color:#fff}
input,select,textarea{width:100%;box-sizing:border-box;padding:9px;margin:4px 0 10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
label{font-size:.85rem;font-weight:600}table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{text-align:left;padding:7px 6px;border-top:1px solid var(--line);vertical-align:top}
.bd{background:var(--soft);padding:2px 8px;font-size:.75rem;font-weight:800}.note{background:var(--soft);padding:10px 14px;font-size:.9rem;margin-bottom:18px;border-left:4px solid var(--y)}.bad{border-left-color:#B3261E}
.tr{max-height:260px;overflow:auto;background:var(--soft);padding:8px;margin-bottom:8px;font-size:.9rem}:focus-visible{outline:3px solid var(--y);outline-offset:2px}
#call{position:fixed;inset:0;background:rgba(10,15,50,.88);display:none;place-items:center;z-index:99;text-align:center;color:#fff}#call.on{display:grid}
#cw{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70}#cw .bx{width:min(380px,calc(100vw - 32px));height:min(520px,70vh);background:var(--bg);border:2px solid var(--b);display:flex;flex-direction:column;margin-bottom:10px}
#cw .bx header{position:static;padding:10px 14px}#cw .tr{flex:1;max-height:none;margin:0}#cw .in{display:flex;gap:6px;padding:8px}#cw .in input{margin:0}
@media (max-width:800px){.w{grid-template-columns:1fr}aside{border:0;padding:0;overflow-x:auto}nav{display:flex}nav a{white-space:nowrap;border-left:0;border-bottom:4px solid transparent}nav a[aria-current]{border-bottom-color:var(--y)}}
</style></head><body><header id="hd"></header><div id="root"></div><div id="cw"></div><div id="call" role="alertdialog" aria-label="Incoming call"></div><input id="fi" type="file" hidden>
<script>
const HOME='/thesisflow/',K='tf3',ADV=.4,FEE=0,T={Foundation:25000,Refined:45000,Distinction:80000};
const FAQ=[['mean|collaboration','We work through your project with you, from topic to analysis. You stay the author.'],['package|pick|price|cost','Foundation is ₦25,000, Refined ₦45,000, Distinction ₦80,000. Masters is custom.'],['print','Printing is not included in any package.'],['start|begin|register','Register as a client, submit your topic and choose a package.'],['pay|payment|50','Pay 100% upfront, or 50% before and 50% on completion.']];
const M={client:[['home','Dashboard'],['review','Review tab'],['chat','Chat room'],['reports','Reports received'],['wallet','Wallet'],['tickets','Report an issue'],['terms','Terms and rules']],coach:[['home','Dashboard'],['profile','My profile'],['market','Marketing profile'],['clients','My clients'],['chat','Chat room'],['reports','Feedback reports'],['wallet','Wallet'],['tickets','Report an issue'],['terms','Terms and rules']],admin:[['home','Dashboard'],['users','Users'],['apps','Coach applications'],['reassign','Reassignments'],['clients','Clients'],['agents','Agents'],['ratings','Ratings and complaints'],['live','Live chats'],['tickets','Tickets'],['reports','All reports'],['terms','Terms and rules']],support:[['live','Live chats'],['tickets','Tickets'],['faq','Chatbot Q&A'],['terms','Terms and rules']],agent:[['home','Dashboard'],['terms','Terms and rules']]};
const seed=()=>({u:[{id:1,n:'Admin',e:'admin@demo.com',p:'demo123',r:'admin',cf:true},{id:2,n:'Dr. Coach',e:'coach@demo.com',p:'demo123',r:'coach',cf:true,st:'approved',ph1:'08000000001',ph2:'08000000002',hl:'Statistics and survey design',sp:'SPSS, surveys, methodology',bio:'I help students plan and understand their analysis.',bank:{bk:'Demo Bank',ac:'0123456789',bvn:'*******1234',nm:'DR. COACH',ok:true}},{id:3,n:'Client One',e:'client@demo.com',p:'demo123',r:'client',cf:true},{id:4,n:'Support',e:'support@demo.com',p:'demo123',r:'support',cf:true},{id:5,n:'Agent One',e:'agent@demo.com',p:'demo123',r:'agent',cf:true}],pr:[],py:[],tk:[],ms:[],co:[],rp:[],rt:[],rf:[],lc:[],au:[],ra:[],wl:{},call:null,n:1001});
let S=JSON.parse(localStorage.getItem(K)||'null')||seed(),me=null,chat=0,sc=0,eu=0,ring=null,ctx=null,wo=false;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const U=i=>S.u.find(x=>x.id==i)||{n:'(none)'},W=i=>S.wl[i]??={av:0,lk:0,log:[]},N=n=>'₦'+Math.round(n).toLocaleString(),P=i=>S.pr.find(x=>x.id==i);
const save=()=>localStorage.setItem(K,JSON.stringify(S)),val=id=>($('#'+id)||{}).value||'',log=t=>S.au.push(new Date().toLocaleString()+' | '+(me?me.n:'visitor')+' | '+t);
const tb=(h,r)=>'<table><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+(r.length?r.map(x=>'<tr>'+x.map(y=>'<td>'+y+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+h.length+'">Nothing yet.</td></tr>')+'</table>';
const bt=(a,i,t,c='')=>`<button class="${c}" data-a="${a}" data-i="${i}">${t}</button>`,f=(id,l,v='',t='text')=>`<label for="${id}">${l}</label><input id="${id}" type="${t}" value="${esc(v)}">`;
const bankOk=u=>u.bank&&u.bank.ok,jr=p=>S.rt.filter(r=>r.p==p.id),avg=a=>a.length?(a.reduce((s,x)=>s+x.s,0)/a.length).toFixed(1):'none';
const rev=p=>{const r=jr(p);return r.length?avg(r)+' stars: '+r.map(x=>(x.cm?'[complaint] ':'')+esc(x.t||'no comment')).join('; '):'No review yet'};
const ava=u=>u.img?`<img class="av" src="${u.img}" alt="${esc(u.n)}">`:`<span class="av" aria-hidden="true">${esc((u.n||'?')[0])}</span>`;
function addPay(p,a,src){S.py.push({id:S.n++,p:p.id,a,src,ap:false});p.paid+=a;W(p.c).log.push(new Date().toLocaleDateString()+': '+N(a)+' paid via '+src)}
function ringStart(){try{ctx??=new AudioContext();ring=setInterval(()=>{const o=ctx.createOscillator();o.frequency.value=880;o.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.4)},1200)}catch(e){}}
function checkCall(){const c=$('#call');if(me&&S.call&&S.call.to==me.id){c.className='on';c.innerHTML=`<div><h1 style="color:#fff">Incoming call</h1><p>${esc(U(S.call.from).n)} is calling about project P-${S.call.p}</p>${bt('ans',S.call.p,'Answer')} ${bt('dec',0,'Decline','r')}</div>`;if(!ring)ringStart()}else{c.className='';clearInterval(ring);ring=null}}
const mine=()=>S.pr.filter(p=>me.r=='client'?p.c==me.id:p.co==me.id);
const RULES=['Be respectful. No abusive, threatening, discriminatory, sexual or harassing language.','Keep the chat about the project. No spam or unrelated promotion.','All payments go through ThesisFlow. Never send or ask for payments outside the platform.','Calls and video happen on the links provided here. Record only with everyone’s consent.','Do not share other people’s work, personal data or confidential material.','Clients remain the authors of their work. Coaches guide, review and explain, and do not write or hand over finished chapters.','Meet the agreed deadline, or tell the other person and Admin before it passes.','Report abuse or problems by raising a ticket. Do not retaliate.','Breaking these rules can lead to a warning, reassignment to another coach, or suspension.'],REASONS=['Missed deadline','Abusive or rude language','Not responding','Unprofessional conduct','Other'];
const TERMS=`<div class="c"><h2>1. The service</h2><p>ThesisFlow provides research coaching, review and guidance. The client stays the author of their work. Printing is not included in any package.</p><h2>2. Deadlines</h2><p>Each project has a deadline of 3, 4 or 5 days, chosen by the client when requesting a coach. The deadline starts when a coach is assigned, and it restarts if the project is reassigned. A coach who will miss a deadline must tell the client and Admin before it passes.</p><h2>3. Room rules</h2><ol>${RULES.map(x=>'<li>'+x+'</li>').join('')}</ol><p>Users must accept the room rules before using the chat room.</p><h2>4. Reassignment</h2><p>A client may ask for a different coach, and Admin may reassign a project, for these reasons: missed deadlines, abusive or rude language, not responding, unprofessional conduct, or another reason Admin accepts. Admin decides the outcome. When a project is reassigned, the new coach receives the project, the deadline restarts, and any payment still held for that project moves to the new coach. Amounts already released to the first coach stay with that coach unless Admin decides otherwise.</p><h2>5. Suspension</h2><p>Admin may suspend any client or coach who breaks these terms or the room rules. A suspended user cannot log in. Admin may lift a suspension. Active projects of a suspended coach are flagged for reassignment.</p><h2>6. Payments and wallets</h2><p>Packages are paid in full, or 50% before and 50% on completion. For each payment Admin approves, 40% of the coach’s share becomes withdrawable and 60% is released when the client marks the project as ended. Client wallets are view-only. Refunds are decided by Admin case by case.</p><h2>7. Becoming a coach</h2><p>Coaches register with an overview, working experience, a CV and two phone numbers (call and WhatsApp), and must confirm their email address. Admin books an interview, and a coach is approved only after it. Approved coaches must also add bank details with a verified name before they are paid. BVN is used for verification only and is not stored.</p><h2>8. Academic integrity</h2><p>Clients must follow their institution’s rules. ThesisFlow does not write or submit work for clients.</p></div>`;
const RB=()=>`<div class="c"><h2>Room rules</h2><ol>${RULES.map(x=>'<li>'+x+'</li>').join('')}</ol>${bt('rules',0,'I agree to the room rules')}</div>`,TP=()=>'<h1>Terms and rules</h1>'+TERMS;
const due=p=>p.due?new Date(p.due).toLocaleDateString()+(Date.now()>p.due&&p.st=='active'?' <span class="bd">overdue</span>':''):p.dl+' days after assignment';
const APPST=()=>me.st=='approved'?'':'<div class="note bad">Application status: '+(me.st=='interview'?'interview booked for '+esc(me.iv)+' (<a href="https://meet.jit.si/ThesisFlow-interview-'+me.id+'" target="_blank" rel="noopener">join link</a>)':me.st=='rejected'?'not approved':'awaiting an interview booking')+'. You can receive clients after approval.</div>';
function thread(){const ps=mine().filter(p=>p.co),p=P(chat);let h=`<div class="c"><h2>Chat room</h2>${ps.map(x=>bt('chat',x.id,'P-'+x.id+' '+esc(x.t),x.id==chat?'s':'')).join('')||'No active projects yet.'}</div>`;if(!me.ra)return RB()+h;if(!p||!ps.includes(p))return h;const o=U(me.r=='client'?p.co:p.c);h+=`<div class="c"><h2>${esc(p.t)} with ${esc(o.n)}</h2><div class="tr">${S.ms.filter(x=>x.p==p.id).map(x=>`<div><b>${esc(U(x.f).n)}:</b> ${esc(x.t)}</div>`).join('')||'No messages yet.'}</div><input id="mt" placeholder="Type a message" aria-label="Message"><button data-a="send" data-i="${p.id}">Send</button> ${bt('call',p.id,'Ring','s')}<a class="bt s" href="https://meet.jit.si/${p.room}" target="_blank" rel="noopener">Video room</a>${me.r=='client'&&o.ph1?`<a class="bt" href="tel:${esc(o.ph1)}">Call</a><a class="bt" href="https://wa.me/${esc(o.ph2.replace(/^0/,'234'))}" target="_blank" rel="noopener">WhatsApp</a>`:''}<details style="margin-top:10px"><summary>Room rules</summary><ol>${RULES.map(x=>'<li>'+x+'</li>').join('')}</ol></details></div>`;return h}
function tickets(){const st=['admin','support'].includes(me.r);return `<div class="g"><div class="c"><h2>Report an issue</h2>${f('ts','Subject')}<label for="tx">Details</label><textarea id="tx" rows="3"></textarea>${bt('tk',0,'Raise ticket')}</div></div><div class="c"><h2>${st?'All tickets':'My tickets'}</h2>${tb(['ID','From','Issue','Status',st?'Action':'Reply'],S.tk.filter(t=>st||t.by==me.id).map(t=>['T-'+t.id,esc(U(t.by).n),esc(t.s+': '+t.b),t.st,st&&t.st=='open'?`<input id="rp${t.id}" placeholder="Reply" aria-label="Reply">`+bt('tr',t.id,'Reply and close'):esc(t.re)]))}</div>`}
function live(){const s=S.lc.find(x=>x.id==sc);return `<div class="g"><div class="c"><h2>Live chat sessions</h2>${tb(['Chat ID','Visitor','Status',''],S.lc.slice().reverse().map(x=>[x.id,esc(x.nm),x.need?'<span class="bd">needs reply</span>':'answered',bt('sel',x.id.slice(3),'Open')]))}</div><div class="c"><h2>${s?s.id+' with '+esc(s.nm):'Select a session'}</h2>${s?`<div class="tr">${s.m.map(m=>`<div><b>${esc(m.f)}:</b> ${esc(m.t)}</div>`).join('')}</div><input id="lrt" placeholder="Reply to ${esc(s.nm)}" aria-label="Reply">${bt('lrp',s.id.slice(3),'Send reply')}`:''}</div></div>`}
function usersPg(){const e=S.u.find(x=>x.id==eu);return `<div class="g"><div class="c"><h2>Add user</h2>${f('an','Name')}${f('ae','Email','','email')}<label for="ar">Role</label><select id="ar">${['client','coach','support','agent','admin'].map(r=>'<option>'+r+'</option>').join('')}</select>${bt('au',0,'Add (password demo123)')}</div>${e?`<div class="c"><h2>Modify ${esc(e.n)}</h2>${f('en','Name',e.n)}${f('ee','Email',e.e,'email')}${f('e1','Call number',e.ph1||'')}${f('e2','WhatsApp number',e.ph2||'')}<label for="er">Role</label><select id="er">${['client','coach','support','agent','admin'].map(r=>'<option'+(r==e.r?' selected':'')+'>'+r+'</option>').join('')}</select>${bt('su',e.id,'Save changes')}</div>`:''}</div><div class="c"><h2>Users</h2>${tb(['ID','Name','Email','Role','Status','Numbers',''],S.u.map(u=>['U-'+u.id,esc(u.n),esc(u.e),u.r,u.sus?'<span class="bd">suspended: '+esc(u.sus)+'</span>':(u.cf?'active':'email not confirmed'),esc((u.ph1||'')+' '+(u.ph2||'')),bt('eu',u.id,'Modify','s')+(u.id==me.id||u.r=='admin'?'':bt('sus',u.id,u.sus?'Unsuspend':'Suspend'))+(u.id==me.id?'':bt('du',u.id,'Delete','r'))]))}</div>`}
function jobs(ps){return tb(['Job','Client','Topic','Status','Deadline','Reviews and average rating'],ps.map(p=>['P-'+p.id,'C-'+p.c+' '+esc(U(p.c).n),esc(p.t),'<span class="bd">'+p.st+'</span>',due(p),rev(p)]))}
const PG={
client:{home(){const m=mine();return `<h1>Dashboard</h1><div class="g"><div class="c"><h2>Request a coach</h2>${f('tp','Research topic')}<label for="tr">Package</label><select id="tr">${Object.keys(T).map(k=>`<option>${k}</option>`).join('')}</select><label for="pl">Payment plan</label><select id="pl"><option value="full">Pay 100% upfront</option><option value="split">50% / 50%</option></select><label for="dl">Deadline (days after a coach is assigned)</label><select id="dl"><option>3</option><option>4</option><option>5</option></select>${bt('newp',0,'Submit topic')}</div></div><div class="c"><h2>My projects</h2>${tb(['Job','Topic','Coach','Deadline','Paid','Status',''],m.map(p=>['P-'+p.id,esc(p.t),esc(U(p.co).n),due(p),N(p.paid)+' / '+N(p.price),'<span class="bd">'+p.st+'</span>',(p.paid<p.price?bt('pay',p.id,'Pay next ('+N(p.plan=='split'&&!p.paid?p.price/2:p.price-p.paid)+')'):'')+(p.st=='active'&&p.paid>=p.price?bt('end',p.id,'Mark as ended','r'):'')+(p.st=='ended'&&!jr(p).length?bt('rate',p.id,'Rate'):'')+(p.co&&p.st=='active'?bt('rq',p.id,'Request new coach','s'):'')]))}</div>`},
review(){const m=mine();return `<h1>Review tab</h1><div class="g"><div class="c"><h2>Send a page for review</h2><label for="cp">Project</label><select id="cp">${m.map(p=>`<option value="${p.id}">P-${p.id} ${esc(p.t)}</option>`)}</select><label for="cn">What should be reviewed or corrected?</label><textarea id="cn" rows="3"></textarea>${bt('pic','co','Snap or choose a photo (optional)','s')}<p id="pn"></p>${bt('corr',0,'Send for review')}</div><div class="c"><h2>My requests</h2>${tb(['Job','Request'],S.co.filter(x=>m.some(p=>p.id==x.p)).map(x=>['P-'+x.p,esc(x.n)]))}</div></div>`},
chat(){return `<h1>Chat room</h1>`+thread()},
reports(){const m=mine().map(p=>p.id);return `<h1>Reports received</h1><div class="c">${tb(['Job','File'],S.rp.filter(x=>m.includes(x.p)).map(x=>['P-'+x.p,esc(x.f)]))}</div>`},
wallet(){const m=mine(),w=W(me.id);return `<h1>Wallet (view only)</h1><div class="c"><p><b>${N(m.reduce((a,p)=>a+p.paid,0))}</b> paid in total. This balance cannot be withdrawn.</p>${w.log.map(x=>'<div>'+esc(x)+'</div>').join('')||'No payments yet.'}</div>`},tickets:()=>'<h1>Report an issue</h1>'+tickets(),terms:TP},
coach:{home(){const w=W(me.id),m=mine(),r=m.flatMap(jr);return `<h1>Dashboard</h1>${APPST()}${bankOk(me)&&me.ph1&&me.ph2?'':'<div class="note bad">Complete your profile: two phone numbers and bank details are required before you can be paid.</div>'}<div class="g"><div class="c"><h2>Wallet</h2><p>Available: <b>${N(w.av)}</b><br>Held until clients end projects: <b>${N(w.lk)}</b></p></div><div class="c"><h2>Jobs</h2><p><b>${m.length}</b> jobs. Average rating: <b>${avg(r)}</b> (${r.length} reviews)</p></div></div>`},
profile(){const b=me.bank||{};return `<h1>My profile</h1><div class="g"><div class="c"><h2>Details</h2>${ava(me)}<br>${bt('pic','img','Change photo','s')}${f('pn1','Full name',me.n)}${f('p1','Call number',me.ph1||'','tel')}${f('p2','WhatsApp number',me.ph2||'','tel')}<label for="pov">Overview</label><textarea id="pov" rows="3">${esc(me.ov||'')}</textarea><label for="pex">Working experience</label><textarea id="pex" rows="3">${esc(me.ex||'')}</textarea><p>CV: ${esc(me.cv||'none')} ${bt('pic','cv2','Replace CV','s')}</p><p id="pn"></p>${bt('prof',0,'Save details')}</div><div class="c"><h2>Bank details (required)</h2>${f('bk','Bank name',b.bk||'')}${f('ac','Account number (10 digits)',b.ac||'')}${f('bv','BVN (11 digits)','','password')}${bt('bank',0,'Save and verify name')}${b.ok?`<p>Verified name: <b>${esc(b.nm)}</b><br>BVN on file: ${esc(b.bvn)}</p>`:'<p>Not verified yet.</p>'}<p class="note">Prototype only: the name check is simulated and only the last 4 BVN digits are kept. In the live app, verification runs on the server with a licensed provider.</p></div></div>`},
market(){return `<h1>Marketing profile</h1><div class="g"><div class="c"><h2>What clients see</h2>${f('mh','Headline',me.hl||'')}${f('ms','Specialities',me.sp||'')}<label for="mb">About you</label><textarea id="mb" rows="4">${esc(me.bio||'')}</textarea>${bt('mk',0,'Save')}</div><div class="c"><h2>Preview</h2>${ava(me)}<h3>${esc(me.n)}</h3><b>${esc(me.hl||'')}</b><p>${esc(me.sp||'')}</p><p>${esc(me.bio||'')}</p></div></div>`},
